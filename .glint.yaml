# Glint: https://github.com/aiseeq/glint
version: 1

settings:
  exclude:
    - vendor/*
    - bin/*
    - testdata/*
    - "**/testdata/*"
    - "*.md"
  min_severity: low
  output: console

categories:
  architecture:
    enabled: true
    rules:
      python-file: {enabled: true}
  duplication: {enabled: true}
  patterns:
    enabled: true
    rules:
      signal-implicit-target:
        exceptions:
          - file: "shellcmd/shellcmd_test.go"
            reason: >-
              The shell snippets are cases of the parser's tests: the file
              hands them to shellcmd.Find and runs bash only with -n, which
              reads a script and runs nothing.
  typesafety: {enabled: true}
  security: {enabled: true}
  deadcode: {enabled: true}
  naming: {enabled: true}
  documentation: {enabled: true}
