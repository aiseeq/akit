# Коммит akit — graft: graft commit -m "…" — гейт, git add -A, проверки, коммит, push.
schema: 1
graft: '>=2.37.0'
# go fix -diff ./... идёт после go vet с его окружением: модернизаторы тулчейна не оставляют правок.
go_fix:
  enabled: true

tasks:
  test:
    desc: все тесты
    tests: go
    run:
      - go test -p {threads} -json {args} ./...
  build:
    desc: собрать утилиты в bin/
    run:
      - go build -o bin/ ./cmd/...
  install:
    desc: поставить утилиты из bin/ в bin_dir (~/bin), только закоммиченное
    deps: [build]
    run:
      - {install: bin/*}

# Гейт: go vet (graft сам, первым шагом), gofmt, тесты и glint без находок.
gate:
  - sh: 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
  - task: test
  # glint падает кодом выхода на находке high (умолчание fail_on); остальные проверяет tk done.
  - sh: GOWORK=off ~/bin/glint check .

version:
  mode: git-tag

push:
  force_with_lease: ['w/*']

checks:
  large_files:
    max_binary_bytes: 1048576
    max_text_bytes: 1048576
    binary_extensions: [png, jpg, jpeg, gif, webp, pdf, gz, zst]

lock:
  scope: worktree
